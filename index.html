<h1>sangaku-yohou<small>山岳気象予報</small></h1>
<p class="lead">山名を入れるだけで、山頂気温・稜線風・体感温度・凍結高度・雷リスク・眺望・登山指数を表示します。
仕組みは<a href="docs/how-it-works.html">図解ページ</a>を参照。</p>

<form id="f">
  <label>山名
    <input id="mname" list="mtlist" placeholder="例: 燕岳" required autocomplete="off">
    <datalist id="mtlist"></datalist>
  </label>
  <label>開始日
    <input type="date" id="mdate">
  </label>
  <label>日数
    <select id="mdays"><option>1</option><option selected>2</option><option>3</option></select>
  </label>
  <label class="chk"><input type="checkbox" id="mweekly">16日見通し</label>
  <label class="chk"><input type="checkbox" id="mmodels">モデル比較</label>
  <button id="go" type="submit">予報を見る</button>
</form>

<div id="status"></div>
<div id="cands"></div>

 85:"にわか雪",86:"にわか雪(強)",95:"雷雨",96:"雷雨(雹)",99:"雷雨(激しい雹)"};
const DIR16=["北","北北東","北東","東北東","東","東南東","南東","南南東","南","南南西","南西","西南西","西","西北西","北西","北北西"];
const WJA="日月火水木金土";
const IDX={A:'<span class="b b-a">A◎</span>',B:'<span class="b b-b">B△</span>',C:'<span class="b b-c">C✕</span>'};
const VCLS={"◎":"v-ex","○":"v-ok","△":"v-so","✕":"v-ng"};

const wdir=d=>d==null?"-":DIR16[Math.floor(((d+11.25)%360)/22.5)];
const wcode=c=>c==null?"-":(WMO[c]||`code${c}`);
const f0=(v,none="-")=>v==null?none:Math.round(v).toString();
const f1=v=>v==null?"-":v.toFixed(1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const md=d=>`${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
const wj=d=>{const w=WJA[d.getDay()];const cls=w==="土"?"sat":w==="日"?"sun":"";return cls?`<span class="${cls}">(${w})</span>`:`(${w})`};

function bracket(elev){
  if(elev<=LEVELS[0][1])return[LEVELS[0],LEVELS[0],0];
  for(let i=0;i<LEVELS.length-1;i++){
    const lo=LEVELS[i],hi=LEVELS[i+1];
    if(elev>=lo[1]&&elev<=hi[1])return[lo,hi,(elev-lo[1])/(hi[1]-lo[1])];
  }
  return[LEVELS.at(-1),LEVELS.at(-1),0];
}
function ridgeWind(h,i,lo,hi,t){
  const sLo=h[`wind_speed_${lo[0]}hPa`]?.[i],sHi=h[`wind_speed_${hi[0]}hPa`]?.[i];
  const dLo=h[`wind_direction_${lo[0]}hPa`]?.[i],dHi=h[`wind_direction_${hi[0]}hPa`]?.[i];
  if(sLo==null||sHi==null)return[sLo??sHi??null,dLo??dHi??null];
  return[sLo+(sHi-sLo)*t,t<0.5?dLo:dHi];
}
function blockIndex(ws,pr3,prob,cape){
  let idx="A";const worse=v=>{if(v==="C"||idx==="C")idx="C";else if(v==="B")idx="B"};
  if(ws!=null){if(ws>=15)worse("C");else if(ws>=10)worse("B")}
  if(pr3!=null){if(pr3>=5)worse("C");else if(pr3>=1)worse("B")}
  if(prob!=null&&prob>=70)worse("B");
  if(cape!=null){if(cape>=1000)worse("C");else if(cape>=500)worse("B")}
  return idx;
}
function viewScore(elev,low,mid,pr3,vis){
  const summit=elev<2000?Math.max(low??-1,mid??-1)<0?null:Math.max(low??0,mid??0):mid;
  const below=elev<2000?null:low;
  if(pr3!=null&&pr3>=1)return["✕","雨"];
  if(vis!=null&&vis<2000)return["✕","ガス"];
  if(summit!=null&&summit>=80)return["✕","ガス"];
  if((summit!=null&&summit>=50)||(vis!=null&&vis<10000))return["△",""];
  const unkai=below!=null&&below>=60&&(summit??0)<=30;
  if((summit??0)<=20&&(vis==null||vis>=20000))return["◎",unkai?"雲海":""];
  return["○",unkai?"雲海":""];
}
const vhtml=([v,n])=>`<span class="${VCLS[v]}">${v}${n?`(${n})`:""}</span>`;

// ---- APIアクセス (リトライつき) ----
async function apiJson(url,params,retries=3){
  const q=new URLSearchParams(params).toString();
  let lastErr;
  for(let a=1;a<=retries;a++){
    try{
      const r=await fetch(`${url}?${q}`);
      if(!r.ok){
        if(r.status<500)throw Object.assign(new Error(`HTTP ${r.status}`),{fatal:true});
        throw new Error(`HTTP ${r.status}`);
      }
      return await r.json();
    }catch(e){
      lastErr=e;
      if(e.fatal||a===retries)break;
      await new Promise(res=>setTimeout(res,1500*a));
    }
  }
  throw new Error(`API呼び出しに失敗しました: ${lastErr.message||lastErr}`);
}

// ---- 山名解決 ----
function resolveLocal(name){
  let hits=MOUNTAINS.filter(m=>m[0]===name||m[1]===name);
  if(!hits.length)hits=MOUNTAINS.filter(m=>m[0].includes(name));
  return hits;
}
async function resolveGeo(name){
  const d=await apiJson("https://geocoding-api.open-meteo.com/v1/search",{name,count:10,language:"ja"});
  const res=(d.results||[]).filter(r=>r.country_code==="JP");
  const mt=res.filter(r=>["MT","PK","VLC","HLL","MTS"].includes(r.feature_code));
  return(mt.length?mt:res).map(r=>({name:r.name,pref:r.admin1||"?",lat:r.latitude,lon:r.longitude,
    elev:r.elevation??null,geo:true}));
}

// ---- 予報取得・描画 ----
function dayIdx(times,dstr){const out=[];for(let i=0;i<times.length;i++)if(times[i].startsWith(dstr))out.push(i);return out}

async function run(mt){
  const status=document.getElementById("status"),out=document.getElementById("out");
  const weekly=document.getElementById("mweekly").checked;
  const compare=document.getElementById("mmodels").checked;
  const days=+document.getElementById("mdays").value;
  const today=new Date();today.setHours(0,0,0,0);
  const horizon=addDays(today,15);
  let start=document.getElementById("mdate").value?new Date(document.getElementById("mdate").value+"T00:00"):today;
  if(start<today)start=today;
  if(start>horizon){status.className="err";status.textContent=`予報範囲外です(最長16日先=${iso(horizon)}まで)`;return}
  const detailEnd=new Date(Math.min(addDays(start,days-1),horizon));
  const fetchEnd=weekly?horizon:new Date(Math.min(Math.max(+addDays(today,6),+detailEnd),+horizon));

  const[lo,hi,t]=bracket(mt.elev);
  const levels=lo[0]===hi[0]?[lo]:[lo,hi];
  const hourly=["temperature_2m","precipitation","precipitation_probability","weather_code",
    "cloud_cover_low","cloud_cover_mid","cloud_cover_high","wind_speed_10m","wind_gusts_10m",
    "freezing_level_height","cape","visibility",
    ...levels.flatMap(p=>[`wind_speed_${p[0]}hPa`,`wind_direction_${p[0]}hPa`])];
  status.className="";status.textContent="予報を取得中…";
  const data=await apiJson("https://api.open-meteo.com/v1/forecast",{
    latitude:mt.lat,longitude:mt.lon,elevation:mt.elev,
    hourly:hourly.join(","),
    daily:"weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,sunrise,sunset",
    timezone:"Asia/Tokyo",wind_speed_unit:"ms",
    start_date:iso(today),end_date:iso(fetchEnd)});
  const h=data.hourly,times=h.time,d=data.daily;

  let htmlOut=`<h2>${esc(mt.name)}(${esc(mt.pref)}) の山岳気象予報</h2><ul class="meta">
    <li>地点: 北緯${mt.lat.toFixed(4)} 東経${mt.lon.toFixed(4)} / 標高 ${Math.round(mt.elev)}m
      (${mt.geo?"地名検索: 標高はグリッド値で山頂より低いことがあります":"内蔵DB"})</li>
    <li>稜線風: ${lo[0]===hi[0]?lo[0]+"hPa":lo[0]+"/"+hi[0]+"hPa補間"} / 気温は標高${Math.round(mt.elev)}m面 /
      体感温度 = 気温 − 稜線風速×1 (慣用則)</li></ul>`;

  // 日別サマリ
  const rows=[];
  for(let dt2=new Date(today);dt2<=fetchEnd;dt2=addDays(dt2,1)){
    const ds=iso(dt2),di=d.time.indexOf(ds);if(di<0)continue;
    const idxs=dayIdx(times,ds);
    const act=idxs.filter(i=>{const hr=+times[i].slice(11,13);return hr>=5&&hr<=16});
    let dayIdxV="A",wsMax=null,wdMax=null;
    for(let sh=3;sh<18;sh+=3){
      const blk=act.filter(i=>Math.floor(+times[i].slice(11,13)/3)*3===sh);
      if(!blk.length)continue;
      const rw=blk.map(i=>ridgeWind(h,i,lo,hi,t));
      const ws=Math.max(...rw.map(x=>x[0]??-1));
      if(ws>=0&&(wsMax==null||ws>wsMax)){wsMax=ws;wdMax=rw.find(x=>x[0]===ws)?.[1]}
      const pr=blk.reduce((s,i)=>s+(h.precipitation[i]||0),0);
      const prob=Math.max(...blk.map(i=>h.precipitation_probability?.[i]??-1));
      const cape=Math.max(...blk.map(i=>h.cape?.[i]??-1));
      const bi=blockIndex(ws<0?null:ws,pr,prob<0?null:prob,cape<0?null:cape);
      if(bi==="C"||(bi==="B"&&dayIdxV==="A"))dayIdxV=bi;
    }
    // 朝の眺望 (4-8時の最良)
    const order={"◎":0,"○":1,"△":2,"✕":3};let best=null;
    for(const i of idxs){
      const hr=+times[i].slice(11,13);if(hr<4||hr>8)continue;
      const v=viewScore(mt.elev,h.cloud_cover_low[i],h.cloud_cover_mid[i],
        (h.precipitation[i]||0)*3,h.visibility?.[i]);
      if(best==null||order[v[0]]<order[best[0]])best=v;
    }
    const fls=idxs.map(i=>h.freezing_level_height?.[i]).filter(v=>v!=null);
    rows.push({d:new Date(dt2),idx:dayIdxV,code:d.weather_code[di],
      tmin:d.temperature_2m_min[di],tmax:d.temperature_2m_max[di],
      ws:wsMax,wd:wdMax,pr:d.precipitation_sum[di],prob:d.precipitation_probability_max[di],
      fl:fls.length?Math.min(...fls):null,view:best?vhtml(best):"-"});
  }
  htmlOut+=`<h2>${weekly?"16日間の見通し":"日別サマリ"}</h2><div class="tbl"><table>
    <tr><th>日付</th><th>指数</th><th>天気</th><th>眺望(朝)</th><th>山頂気温</th><th>稜線風max(5-16時)</th><th>降水量</th><th>降水%</th><th>凍結高度min</th></tr>`;
  for(const r of rows)htmlOut+=`<tr><td>${md(r.d)}${wj(r.d)}</td><td>${IDX[r.idx]}</td><td>${wcode(r.code)}</td>
    <td>${r.view}</td><td>${f0(r.tmin)}〜${f0(r.tmax)}℃</td><td>${wdir(r.wd)} ${f1(r.ws)}m/s</td>
    <td>${r.pr==null?"-":r.pr.toFixed(1)}mm</td><td>${f0(r.prob)}%</td><td>${f0(r.fl)}m</td></tr>`;
  htmlOut+=`</table></div>`;

  // 3時間ごと詳細
  for(let dt2=new Date(start);dt2<=detailEnd;dt2=addDays(dt2,1)){
    const ds=iso(dt2),idxs=dayIdx(times,ds);if(!idxs.length)continue;
    const di=d.time.indexOf(ds);
    const sun=di>=0&&d.sunrise?.[di]?` (日の出${d.sunrise[di].slice(11,16)} / 日の入${d.sunset[di].slice(11,16)})`:"";
    htmlOut+=`<h2>${ds} ${wj(dt2)} 3時間ごと詳細${sun}</h2><div class="tbl"><table>
      <tr><th>時刻</th><th>天気</th><th>眺望</th><th>気温</th><th>体感</th><th>稜線風</th><th>突風</th><th>降水</th><th>降水%</th><th>雷CAPE</th><th>雲(下/中/上)</th><th>視程</th><th>凍結高度</th></tr>`;
    for(let sh=0;sh<24;sh+=3){
      const blk=idxs.filter(i=>Math.floor(+times[i].slice(11,13)/3)*3===sh);
      if(!blk.length)continue;
      const i0=blk[0],temp=h.temperature_2m[i0];
      const rw=blk.map(i=>ridgeWind(h,i,lo,hi,t));
      const wsArr=rw.map(x=>x[0]).filter(v=>v!=null);
      const ws=wsArr.length?Math.max(...wsArr):null;
      const wd2=rw.find(x=>x[0]===ws)?.[1];
      const gustArr=blk.map(i=>h.wind_gusts_10m?.[i]).filter(v=>v!=null);
      const gust=gustArr.length?Math.max(...gustArr):null;
      const pr=blk.reduce((s,i)=>s+(h.precipitation[i]||0),0);
      const probArr=blk.map(i=>h.precipitation_probability?.[i]).filter(v=>v!=null);
      const prob=probArr.length?Math.max(...probArr):null;
      const capeArr=blk.map(i=>h.cape?.[i]).filter(v=>v!=null);
      const cape=capeArr.length?Math.max(...capeArr):null;
      const visArr=blk.map(i=>h.visibility?.[i]).filter(v=>v!=null);
      const vis=visArr.length?Math.min(...visArr):null;
      const feel=(temp==null||ws==null)?null:temp-ws;
      const view=vhtml(viewScore(mt.elev,h.cloud_cover_low[i0],h.cloud_cover_mid[i0],pr,vis));
      const cl=`${f0(h.cloud_cover_low[i0])}/${f0(h.cloud_cover_mid[i0])}/${f0(h.cloud_cover_high[i0])}%`;
      const visTxt=vis==null?"-":vis>=1000?`${Math.round(vis/1000)}km`:`${Math.round(vis)}m`;
      htmlOut+=`<tr><td>${String(sh).padStart(2,"0")}時</td><td>${wcode(h.weather_code[i0])}</td><td>${view}</td>
        <td>${temp==null?"-":temp.toFixed(1)}℃</td><td>${f0(feel)}℃</td><td>${wdir(wd2)} ${f1(ws)}m/s</td>
        <td>${f0(gust)}m/s</td><td>${pr.toFixed(1)}mm</td><td>${f0(prob)}%</td><td>${f0(cape)}</td>
        <td>${cl}</td><td>${visTxt}</td><td>${f0(h.freezing_level_height?.[i0])}m</td></tr>`;
    }
    htmlOut+=`</table></div>`;
  }

  // モデル比較
  if(compare){
    status.textContent="モデル比較を取得中…";
    const cmpEnd=new Date(Math.min(+detailEnd,+addDays(start,2)));
    const models=["jma_seamless","ecmwf_ifs025","gfs_seamless"];
    const labels={jma_seamless:"気象庁JMA",ecmwf_ifs025:"欧州ECMWF",gfs_seamless:"米国GFS"};
    const cd=await apiJson("https://api.open-meteo.com/v1/forecast",{
      latitude:mt.lat,longitude:mt.lon,elevation:mt.elev,
      hourly:"temperature_2m,precipitation,wind_speed_10m,cloud_cover",
      timezone:"Asia/Tokyo",wind_speed_unit:"ms",models:models.join(","),
      start_date:iso(start),end_date:iso(cmpEnd)});
    const ch=cd.hourly;
    htmlOut+=`<h2>モデル間比較（各モデルが一致するほど信頼度が高い）</h2><div class="tbl"><table>
      <tr><th>日付</th><th>モデル</th><th>気温min〜max</th><th>降水量</th><th>10m風max</th><th>平均雲量</th></tr>`;
    for(let dt2=new Date(start);dt2<=cmpEnd;dt2=addDays(dt2,1)){
      const idxs=dayIdx(ch.time,iso(dt2));
      for(const m of models){
        const col=v=>{const k=ch[`${v}_${m}`]?`${v}_${m}`:v;return idxs.map(i=>ch[k]?.[i]).filter(x=>x!=null)};
        const temps=col("temperature_2m"),precs=col("precipitation"),winds=col("wind_speed_10m"),clouds=col("cloud_cover");
        htmlOut+=temps.length?
          `<tr><td>${md(dt2)}</td><td>${labels[m]}</td><td>${Math.round(Math.min(...temps))}〜${Math.round(Math.max(...temps))}℃</td>
           <td>${precs.reduce((a,b)=>a+b,0).toFixed(1)}mm</td><td>${Math.max(...winds).toFixed(1)}m/s</td>
           <td>${Math.round(clouds.reduce((a,b)=>a+b,0)/clouds.length)}%</td></tr>`:
          `<tr><td>${md(dt2)}</td><td>${labels[m]}</td><td colspan="4">(データなし)</td></tr>`;
      }
    }
    htmlOut+=`</table></div>`;
  }

  htmlOut+=`<div class="notice">⚠️ 数値予報は山岳地形では誤差が大きく、局地的な突風・雷雨・視界不良は表現しきれません。
    登山指数は目安です。最終判断は最新の予報（<a href="https://i.yamatenki.co.jp/">ヤマテン</a>・
    <a href="https://tenki.jp/mountain/">tenki.jp山の天気</a>等）と現地の状況で行ってください。</div>`;
  out.innerHTML=htmlOut;
  status.textContent="";
  location.hash=encodeURIComponent(mt.name)+"/"+iso(start)+"/"+days+(weekly?"/w":"");
}

// ---- フォーム制御 ----
function showCandidates(list){
  const c=document.getElementById("cands");
  c.innerHTML="<b>複数の候補があります。選んでください:</b>"+list.map((m,i)=>
    `<button data-i="${i}">${esc(m.name)}（${esc(m.pref)}） 標高${m.elev==null?"?":Math.round(m.elev)}m</button>`).join("");
  c.querySelectorAll("button").forEach(b=>b.onclick=()=>{c.innerHTML="";go(list[+b.dataset.i])});
}
async function go(mt){
  const btn=document.getElementById("go"),status=document.getElementById("status");
  btn.disabled=true;
  try{await run(mt)}
  catch(e){status.className="err";status.textContent=e.message+" — 時間をおいて再度お試しください";}
  finally{btn.disabled=false}
}
document.getElementById("f").onsubmit=async e=>{
  e.preventDefault();
  const status=document.getElementById("status");
  document.getElementById("cands").innerHTML="";document.getElementById("out").innerHTML="";
  status.className="";status.textContent="";
  const name=document.getElementById("mname").value.trim();
  let hits=resolveLocal(name).map(m=>({name:m[0],pref:m[2],lat:m[3],lon:m[4],elev:m[5]}));
  if(hits.length===1)return go(hits[0]);
  if(hits.length>1)return showCandidates(hits);
  status.textContent="内蔵DBに無いため地名検索中…";
  try{
    const geo=await resolveGeo(name);
    if(!geo.length){status.className="err";status.textContent=`「${name}」が見つかりませんでした`;return}
    const ok=geo.filter(g=>g.elev!=null);
    if(ok.length===1)return go(ok[0]);
    showCandidates(ok.length?ok:geo);status.textContent="";
  }catch(e){status.className="err";status.textContent=e.message}
};

// 初期化: datalist・日付範囲・URLハッシュ復元
{
  const dl=document.getElementById("mtlist");
  for(const m of MOUNTAINS){const o=document.createElement("option");o.value=m[0];o.label=`${m[2]} ${m[5]}m`;dl.appendChild(o)}
  const today=new Date(),di=document.getElementById("mdate");
  di.value=iso(today);di.min=iso(today);di.max=iso(addDays(today,15));
  const hash=decodeURIComponent(location.hash.slice(1));
  if(hash){
    const[nm,dt2,dy,wk]=hash.split("/");
    if(nm){document.getElementById("mname").value=nm;
      if(dt2)di.value=dt2;if(dy)document.getElementById("mdays").value=dy;
      if(wk==="w")document.getElementById("mweekly").checked=true;
      document.getElementById("f").requestSubmit();}
  }
}
